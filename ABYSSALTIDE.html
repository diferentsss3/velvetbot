<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04121f">
<title>Abyssal Tide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
:root{--ink:#04121f;--bg:#082c44;--bone:#e8f8ff;--green:#2de2e6;--orange:#ff9f1c;--pink:#ff5da2;--purple:#0e7490;--gold:#ffd23f;--cell:70px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--bone);font-family:'Rubik',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ft{font-family:'Bungee','Impact',sans-serif}
#app{position:relative;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#04121f}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.fog{position:absolute;left:-30%;width:160%;height:200px;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(125,211,252,.18),rgba(125,211,252,0) 65%);filter:blur(6px)}
.fog.f1{bottom:25%;animation:drift 14s ease-in-out infinite alternate}
.fog.f2{bottom:5%;animation:drift 19s ease-in-out infinite alternate-reverse;opacity:.8}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
header{position:relative;z-index:3;text-align:center;padding:calc(env(safe-area-inset-top) + 8px) 0 2px}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:.9}
.logo small{font-family:'Bungee';font-size:15px;letter-spacing:2px;color:var(--bone);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.logo b{font-family:'Bungee';font-size:42px;color:var(--green);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 24px rgba(45,226,230,.75);letter-spacing:3px}
#hud{position:relative;z-index:3;height:38px;display:flex;align-items:center;justify-content:center;padding:0 12px}
#msg{font-weight:900;font-size:14px;letter-spacing:.5px;text-align:center;color:var(--bone);text-shadow:0 2px 0 var(--ink)}
#msg.win{color:var(--green);font-size:20px;font-family:'Bungee'}
#fsinfo{display:none;gap:8px;align-items:center;width:100%;justify-content:center}
#fsinfo .chip{background:linear-gradient(#fde68a,#f59e0b);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:3px 12px;font-family:'Bungee';font-size:14px;box-shadow:0 3px 0 var(--ink)}
#fsinfo .chip.m{background:linear-gradient(#a7f3d0,#0284c7);color:var(--bone)}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35) rotate(-4deg)}}
#app.fs #msg{display:none}#app.fs #fsinfo{display:flex}
main{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
#frame{position:relative;padding:10px;border-radius:24px;background:linear-gradient(#0c4a6e,#082c44);border:5px solid var(--ink);box-shadow:0 0 0 3px #0ea5e9,0 0 44px rgba(45,226,230,.5),0 10px 0 rgba(0,0,0,.35)}
#app.fs #frame{box-shadow:0 0 0 3px var(--green),0 0 50px rgba(45,226,230,.7),0 10px 0 rgba(0,0,0,.35)}
.plate{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:linear-gradient(#fde68a,#f59e0b);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:2px 14px;font-family:'Bungee';font-size:12px;white-space:nowrap;box-shadow:0 3px 0 var(--ink);z-index:6}
.corner{position:absolute;width:28px;height:28px;z-index:6;top:-10px}
.corner.l{left:-4px}.corner.r{right:-4px}
#reels{display:flex;gap:3px;border-radius:14px;overflow:hidden;background:#04121f;padding:3px;position:relative}
.col{width:var(--cell);height:calc(var(--cell)*4);overflow:hidden;position:relative;border-radius:8px;background:linear-gradient(#0c3d5c,#062338)}
.strip{will-change:transform}
.strip.moving{filter:blur(1.4px)}
.cell{width:var(--cell);height:var(--cell);padding:5%;border-bottom:1px solid rgba(255,255,255,.05)}
.cell svg{width:100%;height:100%;display:block;overflow:visible}
.cell.win{background:radial-gradient(circle,rgba(45,226,230,.32),rgba(45,226,230,0) 70%)}
.cell.win svg{animation:wig .55s ease-in-out infinite}
.cell.dim svg{filter:brightness(.4) saturate(.5)}
.cell.coll svg{animation:glow .45s ease-in-out infinite alternate}
.cell.land svg{animation:land .35s ease-out}
@keyframes wig{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-4deg)}70%{transform:scale(1.12) rotate(4deg)}}
@keyframes glow{from{transform:scale(1);filter:drop-shadow(0 0 2px #ffd23f)}to{transform:scale(1.15);filter:drop-shadow(0 0 12px #ffd23f)}}
@keyframes land{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden;border-radius:20px}
.pop{position:absolute;font-family:'Bungee';color:var(--gold);font-size:18px;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transform:translate(-50%,-50%);animation:pop 1s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
footer{position:relative;z-index:3;padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(rgba(4,18,31,0),rgba(4,18,31,.94) 30%)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:#0a2537;border:3px solid var(--ink);border-radius:14px;padding:4px 6px;text-align:center;box-shadow:0 0 0 2px #0e7490,0 3px 0 var(--ink)}
.stat span{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;color:#7dd3fc}
.stat b{display:block;font-family:'Bungee';font-size:17px;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.w b{color:var(--green)}
.stat.bt b{color:var(--gold)}
.row{display:flex;justify-content:center;align-items:center;gap:9px}
.btn{border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s;flex:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{width:46px;height:46px;background:linear-gradient(#7dd3fc,#0369a1);font-family:'Bungee';font-size:26px;color:var(--bone)}
.btn.spin{width:92px;height:92px;background:radial-gradient(circle at 35% 30%,#a7f3d0,#22d3ee 55%,#0891b2);box-shadow:0 7px 0 var(--ink),0 0 26px rgba(45,226,230,.7)}
.btn.spin:active{box-shadow:0 2px 0 var(--ink),0 0 16px rgba(45,226,230,.6);transform:translateY(5px)}
.btn.spin svg{width:54px;height:54px}
.btn.spin.go svg{animation:rot 0.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn.buy{width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#fff1a8,#ffb61f 60%,#e27a00);color:var(--ink);flex-direction:column;font-family:'Bungee';line-height:1}
.btn.buy small{font-size:9px}
.btn.buy b{font-size:16px}
.btn.auto{width:66px;height:66px;background:linear-gradient(#ff7aa8,#e0245e);font-family:'Bungee';font-size:12px;color:var(--bone);flex-direction:column;line-height:1.1}
.btn.auto.on{background:linear-gradient(#a7f3d0,#22d3ee);color:var(--ink)}
.btn[disabled],.btn.dis{filter:grayscale(.8) brightness(.6);pointer-events:none}
.pills{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pill{background:#0a2537;border:3px solid var(--ink);box-shadow:0 0 0 2px #0e7490,0 3px 0 var(--ink);border-radius:20px;padding:5px 12px;font-weight:900;font-size:12px;letter-spacing:.5px;color:var(--bone)}
.pill.on{background:var(--green);color:var(--ink)}
.pill:active{transform:translateY(2px)}
.ov{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(2,10,20,.78);backdrop-filter:blur(3px);padding:20px}
.ov.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{width:100%;max-width:380px;max-height:86%;overflow:auto;background:linear-gradient(#0c4a6e,#082c44);border:5px solid var(--ink);box-shadow:0 0 0 3px #0ea5e9,0 0 50px rgba(45,226,230,.55);border-radius:26px;padding:22px 18px;text-align:center;animation:cardin .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardin{from{transform:scale(.6);opacity:0}}
.card h2{font-family:'Bungee';font-size:28px;color:var(--green);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);line-height:1.05;margin-bottom:10px}
.card .big{font-family:'Bungee';font-size:54px;color:var(--gold);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);line-height:1;margin:6px 0 12px}
.card p{font-size:14px;line-height:1.45;color:#c7e8f5;margin-bottom:14px;font-weight:500}
.card .acts{display:flex;gap:10px;justify-content:center}
.cta{background:linear-gradient(#a7f3d0,#0ea5e9);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:12px 26px;font-family:'Bungee';font-size:17px;box-shadow:0 5px 0 var(--ink)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cta.alt{background:linear-gradient(#ff8fb4,#e0245e);color:var(--bone)}
.pt{display:grid;grid-template-columns:48px 1fr;gap:4px 10px;align-items:center;text-align:left;margin:8px 0 12px}
.pt svg{width:46px;height:46px}
.pt .p{font-size:12px;color:#c7e8f5;font-weight:700}
.pt .p i{font-style:normal;color:var(--gold);font-family:'Bungee';font-size:12px}
.rules{text-align:left;font-size:12.5px;color:#c7e8f5;line-height:1.5;margin-bottom:14px}
.rules li{margin:0 0 6px 16px}
.rules b{color:var(--green)}
#bigwin{z-index:60;background:radial-gradient(circle,rgba(45,226,230,.2),rgba(2,10,20,.85) 70%)}
#bigwin .card{background:none;border:0;box-shadow:none;animation:bwin .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes bwin{from{transform:scale(.2) rotate(-12deg);opacity:0}}
#bigwin h2{font-size:44px;color:var(--orange)}
#bigwin .big{font-size:60px}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:70;background:var(--pink);color:var(--bone);border:4px solid var(--ink);border-radius:16px;padding:8px 16px;font-weight:900;font-size:13px;box-shadow:0 4px 0 var(--ink);display:none;white-space:nowrap}
#toast.show{display:block;animation:fade .2s}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,18,31,.95);z-index:100;font-size:14px;color:var(--green);font-family:'Bungee'}
.loading[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <svg id="bg" viewBox="0 0 480 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".4" stop-color="#0369a1"/><stop offset=".75" stop-color="#0c4a6e"/><stop offset="1" stop-color="#04121f"/></linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="0%"><stop offset="0" stop-color="#e0f2fe" stop-opacity=".85"/><stop offset="1" stop-color="#e0f2fe" stop-opacity="0"/></radialGradient>
      <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd" stop-opacity=".3"/><stop offset="1" stop-color="#bae6fd" stop-opacity="0"/></linearGradient>
    </defs>
    <rect width="480" height="900" fill="url(#sky)"/>
    <ellipse cx="240" cy="0" rx="420" ry="220" fill="url(#sunGlow)"/>
    <path d="M180 0 L215 420 L195 420 Z" fill="url(#ray)"/>
    <path d="M300 0 L280 380 L320 380 Z" fill="url(#ray)"/>
    <path d="M70 0 L130 340 L90 340 Z" fill="url(#ray)"/>
    <g fill="#bae6fd"><circle cx="60" cy="180" r="4" opacity=".55"/><circle cx="380" cy="230" r="5" opacity=".4"/><circle cx="420" cy="330" r="3" opacity=".5"/><circle cx="120" cy="380" r="6" opacity=".3"/><circle cx="320" cy="440" r="4" opacity=".4"/><circle cx="200" cy="290" r="3" opacity=".5"/></g>
    <path d="M0 720 Q100 680 200 710 Q320 740 480 700 L480 900 L0 900Z" fill="#0f2a3d" stroke="#04121f" stroke-width="4"/>
    <g stroke="#0d9488" stroke-width="8" fill="none" stroke-linecap="round"><path d="M60 900 Q50 850 70 800 Q90 750 70 700"/><path d="M100 900 Q90 860 100 820"/><path d="M400 900 Q410 840 390 790 Q375 750 395 710"/></g>
    <g stroke="#14b8a6" stroke-width="6" fill="none" stroke-linecap="round"><path d="M30 900 Q25 860 40 830"/><path d="M440 900 Q445 850 430 810"/></g>
    <path d="M340 720 Q355 690 380 700 Q400 695 410 720 Z" fill="#0c1f2e" stroke="#04121f" stroke-width="3"/>
    <path d="M120 715 Q135 690 160 700 Q175 695 185 720 Z" fill="#0c1f2e" stroke="#04121f" stroke-width="3"/>
  </svg>
  <div class="fog f1"></div><div class="fog f2"></div>
  <header><div class="logo"><small>ABYSSAL</small><b>TIDE</b></div></header>
  <div id="hud">
    <div id="msg">Крути и ныряй!</div>
    <div id="fsinfo">
      <div class="chip" id="fsLeft">СПИНЫ 8</div>
      <div class="chip m" id="fsMult">МНОЖ. x1</div>
      <div class="chip" id="fsWin" style="background:linear-gradient(#ff8fb4,#e0245e);color:#e8f8ff">0</div>
    </div>
  </div>
  <main>
    <div id="frame">
      <div class="plate">1024 ПУТИ • МАКС. x15000</div>
      <svg class="corner l" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fcd34d" stroke="#04121f" stroke-width="8"/><path d="M50 14 L58 42 L86 44 L64 62 L72 90 L50 74 L28 90 L36 62 L14 44 L42 42Z" fill="#04121f"/></svg>
      <svg class="corner r" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fcd34d" stroke="#04121f" stroke-width="8"/><path d="M50 14 L58 42 L86 44 L64 62 L72 90 L50 74 L28 90 L36 62 L14 44 L42 42Z" fill="#04121f"/></svg>
      <div id="reels"></div>
      <div id="fx"></div>
    </div>
  </main>
  <footer id="foot">
    <div class="stats">
      <div class="stat"><span>БАЛАНС</span><b id="bal">…</b></div>
      <div class="stat bt"><span>СТАВКА</span><b id="bet">0</b></div>
      <div class="stat w"><span>ВЫИГРЫШ</span><b id="win">0</b></div>
    </div>
    <div class="row">
      <button class="btn buy" id="btnBuy"><small>БОНУС</small><b>x95</b></button>
      <button class="btn sm" id="btnMinus">−</button>
      <button class="btn spin" id="btnSpin" aria-label="Спин"><svg viewBox="0 0 48 48"><path d="M24 9a15 15 0 1 0 14 20" fill="none" stroke="#04121f" stroke-width="7" stroke-linecap="round"/><path d="M20 -1 L38 10 L20 21Z" fill="#04121f" stroke="#04121f" stroke-width="3" stroke-linejoin="round" transform="translate(4 1)"/></svg></button>
      <button class="btn sm" id="btnPlus">+</button>
      <button class="btn auto" id="btnAuto"><span>АВТО</span></button>
    </div>
    <div class="pills">
      <button class="pill" id="btnTurbo">⚡ ТУРБО</button>
      <button class="pill" id="btnRules">ℹ ПРАВИЛА</button>
      <button class="pill on" id="btnSound">🔊 ЗВУК</button>
    </div>
  </footer>
  <div class="ov" id="ov"><div class="card" id="card"></div></div>
  <div class="ov" id="bigwin"><div class="card"><h2 id="bwTitle">BIG WIN</h2><div class="big" id="bwNum">0</div></div></div>
  <div id="toast"></div>
</div>
<div class="loading" id="loading">Подключение…</div>

<script>
// ══════════════════ ENGINE ══════════════════
const COLS=5, ROWS=4;
const CFG={MAX_WIN:15000, BUY:95, START_SPINS:{3:8,4:12,5:16}, RETRIG:{3:5,4:7,5:10}};
const PAY={shell:[0.03,0.09,0.26], star:[0.03,0.09,0.26], coral:[0.05,0.14,0.38], pearl:[0.05,0.14,0.38], anchor:[0.09,0.24,0.78], lamp:[0.1,0.31,1.04], jelly:[0.14,0.43,1.56], shark:[0.21,0.69,2.59]};
const WEIGHTS={
  base:{shell:20,star:20,coral:16,pearl:16,anchor:8,lamp:6,jelly:4.5,shark:3,octopus:0.5,chest:1.8,compass:0.8},
  fs:{shell:16,star:16,coral:14,pearl:14,anchor:7,lamp:5,jelly:4,shark:2.5,octopus:1.1,chest:3.2,compass:0.9}
};
const COFFIN={
  base:[[0.5,30],[1,26],[2,18],[3,10],[5,7],[10,5],[25,2.5],[50,.8],[100,.2]],
  fs:[[1,26],[2,22],[3,14],[5,11],[10,9],[25,4],[50,2],[100,.8],[250,.2]]
};
let rng=()=>{if(typeof crypto!=='undefined'&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}return Math.random();};
function mk(pairs){let t=0;const cum=pairs.map(([k,w])=>{t+=w;return [k,t]});return {cum,t}}
function pickFrom(tb){const x=rng()*tb.t;for(const [k,c] of tb.cum)if(x<c)return k;return tb.cum[tb.cum.length-1][0]}
const TB={};for(const m in WEIGHTS) TB[m]={sym:mk(Object.entries(WEIGHTS[m])),cof:mk(COFFIN[m])};
function spin(mode,mult){
  mult=mult||1;const T=TB[mode],grid=[];let sc=0,dg=0,cofSum=0;
  for(let c=0;c<COLS;c++){const col=[];for(let r=0;r<ROWS;r++){const s=pickFrom(T.sym);let v=0;if(s==='chest'){v=pickFrom(T.cof);cofSum+=v}else if(s==='compass')sc++;else if(s==='octopus')dg++;col.push({s,v})}grid.push(col)}
  const wins=[];let waysPay=0;
  for(const s in PAY){const cnt=[];let n=0,ways=1;for(let c=0;c<COLS;c++){let k=0;for(let r=0;r<ROWS;r++){const t=grid[c][r].s;if(t===s||t==='octopus')k++}cnt.push(k)}for(let c=0;c<COLS;c++){if(!cnt[c])break;n++;ways*=cnt[c]}if(n>=3){const pay=PAY[s][n-3]*ways,cells=[];for(let c=0;c<n;c++)for(let r=0;r<ROWS;r++){const t=grid[c][r].s;if(t===s||t==='octopus')cells.push([c,r])}wins.push({s,n,ways,pay,cells});waysPay+=pay}}
  let newMult=mult,collect=0;
  if(dg>0){if(mode==='fs')newMult=mult+dg;if(cofSum>0)collect=cofSum*(mode==='fs'?newMult:1)}
  return {grid,wins,waysPay,collect,cofSum,dg,sc,newMult,total:waysPay+collect};
}
const Engine={spin,PAY,CFG,COFFIN,WEIGHTS};

// ══════════════════ СИМВОЛЫ ══════════════════
const INK='#04121f';
const O=`stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
const ART={
  shell:()=>`<g><path d="M50 96 Q14 88 14 50 Q14 20 50 8 Q86 20 86 50 Q86 88 50 96Z" fill="#5eead4" ${O}/><path d="M50 12 V96 M32 18 Q24 55 30 92 M68 18 Q76 55 70 92 M18 34 Q14 65 22 90 M82 34 Q86 65 78 90" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="92" rx="14" ry="4" fill="${INK}"/><ellipse cx="38" cy="34" rx="4" ry="10" fill="#fff" opacity=".5"/></g>`,
  star:()=>`<g><path d="M50 6 L61 36 L94 37 L68 57 L77 88 L50 70 L23 88 L32 57 L6 37 L39 36Z" fill="#f472b6" ${O}/><circle cx="50" cy="48" r="7" fill="#fce7f3" stroke="${INK}" stroke-width="2.5"/><circle cx="50" cy="48" r="2.5" fill="${INK}"/><circle cx="30" cy="42" r="1.5" fill="${INK}"/><circle cx="70" cy="42" r="1.5" fill="${INK}"/><circle cx="50" cy="78" r="1.5" fill="${INK}"/></g>`,
  coral:()=>`<g><path d="M50 96 V50 M50 62 Q32 44 26 22 M50 68 Q68 48 76 24 M50 76 Q26 66 18 46 M50 74 Q74 70 84 48" stroke="${INK}" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 96 V50 M50 62 Q32 44 26 22 M50 68 Q68 48 76 24 M50 76 Q26 66 18 46 M50 74 Q74 70 84 48" stroke="#fb923c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="22" r="5" fill="#fdba74" ${O}/><circle cx="76" cy="24" r="5" fill="#fdba74" ${O}/><circle cx="18" cy="46" r="5" fill="#fdba74" ${O}/><circle cx="84" cy="48" r="5" fill="#fdba74" ${O}/></g>`,

let INIT_DATA='';

async function apiCall(path,data={}){
  try{
    const r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...data,initData:INIT_DATA})});
    return await r.json();
  }catch(e){return {ok:false}}
}
async function initFromServer(){
  if(!INIT_DATA)return;
  const r=await apiCall('/me');
  if(r.ok&&r.user){balance=Number(r.user.balance)||0;ready=true;updUI();document.getElementById('loading').hidden=true;}
  else{setTimeout(initFromServer,1000)}
}
async function syncServerBet(betAmount,winAmount){
  const r=await apiCall('/bet',{game:'slot',bet:betAmount,params:{win:winAmount,alreadyDeducted:true}});
  if(r.ok&&typeof r.balance==='number'){balance=r.balance;updUI();}
  return r;
}

function tone(f,d,type,v,slide,delay){if(!snd)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);}
const sfx={spin(){tone(220,.5,'sawtooth',.035,260)},land(){tone(120,.12,'sine',.14,-60)},win(n){const base=[523,659,784,1047,1319];for(let i=0;i<Math.min(5,n);i++)tone(base[i],.16,'triangle',.07,0,i*.07)},coin(i){tone(900+i*90,.1,'square',.035,500,0)},scatter(){tone(180,.4,'sawtooth',.06,300);tone(360,.5,'triangle',.06,200,.1)},fanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.07,0,i*.09))},click(){tone(500,.05,'square',.03)}};

function layout(){const app=$('app');const wBased=Math.floor((app.clientWidth-20-6-12-12)/5);const free=window.innerHeight-document.querySelector('header').offsetHeight-$('hud').offsetHeight-$('foot').offsetHeight-52;cell=Math.max(44,Math.min(wBased,Math.floor(free/4),96));document.documentElement.style.setProperty('--cell',cell+'px');}
function buildReels(){const reels=$('reels');reels.innerHTML='';strips=[];cur=[];for(let c=0;c<COLS;c++){const col=document.createElement('div');col.className='col';const st=document.createElement('div');st.className='strip';col.appendChild(st);reels.appendChild(col);strips.push(st);const arr=[];for(let r=0;r<ROWS;r++)arr.push({s:filler(),v:0});cur.push(arr);setColumn(c,arr);}}
const FILL=['shell','star','coral','pearl','anchor','lamp','jelly','shark'];

const allCells=()=>{const a=[];for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)a.push([c,r,getCell(c,r)]);return a};

function highlight(set){const keys=new Set(set.map(x=>x[0]+','+x[1]));allCells().forEach(([c,r,el])=>{if(!el)return;if(keys.has(c+','+r)){el.classList.add('win');el.classList.remove('dim')}else if(!el.classList.contains('win'))el.classList.add('dim')});}

function showCard(html,{ok='ОК',cancel=null}={}){return new Promise(res=>{const ov=$('ov'),card=$('card');card.innerHTML=html+`<div class="acts">${cancel?`<button class="cta alt" id="cCancel">${cancel}</button>`:''}<button class="cta" id="cOk">${ok}</button></div>`;ov.classList.add('show');const done=v=>{ov.classList.remove('show');res(v)};$('cOk').onclick=()=>{sfx.click();done(true)};if(cancel)$('cCancel').onclick=()=>{sfx.click();done(false)};});}
function showBig(x,amount){const tiers=[[500,'ЛЕГЕНДА ГЛУБИН!'],[100,'ЭПИЧНО!'],[30,'МЕГА ВИН'],[10,'БИГ ВИН']];const t=tiers.find(t=>x>=t[0]);if(!t)return Promise.resolve();return new Promise(async res=>{const ov=$('bigwin');$('bwTitle').textContent=t[1];ov.classList.add('show');sfx.fanfare();hap('heavy');let closed=false;const close=()=>{if(closed)return;closed=true;ov.classList.remove('show');res()};ov.onclick=close;await countUp($('bwNum'),0,amount,turbo?900:2200);setTimeout(close,turbo?400:1300);});}

async function animateSpin(grid){const dur=turbo?380:900,stag=turbo?45:140;strips.forEach((st,c)=>{const n=(turbo?4:8)+c*(turbo?1:3);let html='';grid[c].forEach(x=>html+=cellHTML(x.s,x.v));for(let i=0;i<n;i++)html+=cellHTML(filler(),0);cur[c].forEach(x=>html+=cellHTML(x.s,x.v));st.style.transition='none';st.innerHTML=html;st.style.transform=`translateY(${-(n+4)*cell}px)`;st.classList.add('moving');});void $('reels').offsetWidth;strips.forEach((st,c)=>{st.style.transition=`transform ${dur+c*stag}ms cubic-bezier(.25,.9,.3,1.05)`;st.style.transform='translateY(0)';});sfx.spin();for(let c=0;c<COLS;c++){const d=dur+c*stag;setTimeout(()=>{strips[c].classList.remove('moving');sfx.land();hap('light')},d*0.85);}await wait(dur+(COLS-1)*stag+80);for(let c=0;c<COLS;c++)setColumn(c,grid[c]);cur=grid;allCells().forEach(([c,r,el])=>{const s=grid[c][r].s;if(s==='compass'||s==='octopus'||s==='chest')el.classList.add('land')});}

async function playRound(free,capLeft){
  const bet=BETS[betIdx];clearHL();setWin(0);
  const res=Engine.spin(fs.on?'fs':'base',fs.mult);
  setMsg(free?'ГЛУБЖЕ В БОНУС...':'ПОГРУЖАЕМСЯ...');
  await animateSpin(res.grid);
  let win=0;const cap=capLeft;
  if(res.wins.length){const set=[];res.wins.forEach(w=>set.push(...w.cells));highlight(set);sfx.win(res.wins.length);hap('medium');const w=Math.min(cap,Math.round(res.waysPay*bet));setMsg('+'+fmt(w),true);await countUp($('win'),0,w,T(600));win+=w;await wait(T(450));}
  if(res.dg>0){const dCells=[],cCells=[];res.grid.forEach((col,c)=>col.forEach((x,r)=>{if(x.s==='octopus')dCells.push([c,r]);if(x.s==='chest')cCells.push([c,r,x.v])}));if(fs.on){fs.mult=res.newMult;const m=$('fsMult');m.textContent='МНОЖ. x'+fs.mult;m.classList.remove('bump');void m.offsetWidth;m.classList.add('bump')}if(cCells.length){allCells().forEach(([c,r,el])=>el.classList.remove('dim'));dCells.forEach(([c,r])=>getCell(c,r).classList.add('win'));setMsg(fs.on?`ОСЬМИНОГ СОБИРАЕТ x${fs.mult}!`:'ОСЬМИНОГ СОБИРАЕТ!',true);const plus=Math.min(cap-win,Math.round(res.collect*bet));let i=0;for(const [c,r,v] of cCells){getCell(c,r).classList.add('coll');sfx.coin(i++);hap('light');popAt(c,r,'+'+(v<1?v:v)+'x');await wait(T(170));}await wait(T(250));await countUp($('win'),win,win+plus,T(700));win+=plus;await wait(T(350));}else if(fs.on){await wait(T(300))}}
  win=Math.min(win,cap);
  if(win>0){balance+=win;updUI()}
  setWin(win);
  return {win,res};
}

async function onSpin(){
  if(busy||!ready)return;ac();
  const bet=BETS[betIdx];
  if(balance<bet){toast('Не хватает фишек');auto=false;syncAuto();return;}
  busy=true;lock(true);balance-=bet;updUI();
  try{
    const r=await playRound(false,Engine.CFG.MAX_WIN*bet);
    if(r.res.sc>=3){await scatterFX(r.res);await runFreeSpins(r.res.sc,false,r.win);}
    else{if(r.win>0){setMsg('ВЫИГРЫШ '+fmt(r.win),true);await showBig(r.win/bet,r.win)}else setMsg('Крути и ныряй!');await syncServerBet(bet,r.win);}
  }catch(e){console.error(e)}
  busy=false;lock(false);

  for(const s of ['shark','jelly','lamp','anchor','pearl','coral','star','shell']){const p=Engine.PAY[s];rows+=`<div>${symSVG(s,0)}</div><div class="p">${names[s]}: 3 — <i>${p[0]}x</i> · 4 — <i>${p[1]}x</i> · 5 — <i>${p[2]}x</i></div>`;}
  const html=`<h2>ПРАВИЛА</h2><div class="pt">${rows}<div>${symSVG('octopus',0)}</div><div class="p"><b style="color:#2de2e6">ОСЬМИНОГ</b> — Wild, забирает все сундуки на экране.</div><div>${symSVG('chest',25)}</div><div class="p"><b style="color:#ffd23f">СУНДУК</b> — 0.5x–100x ставки.</div><div>${symSVG('compass',0)}</div><div class="p"><b style="color:#2de2e6">КОМПАС</b> — 3+ дают 8/12/16 фриспинов.</div></div><ul class="rules"><li>1024 пути.</li><li>Во фриспинах каждый Осьминог +1 к множителю. Сбор сундуков умножается на него.</li><li>RTP ≈ 85%. Максимальный выигрыш x15000.</li></ul>`;
  showCard(html,{ok:'ЗАКРЫТЬ'});
}

function syncAuto(){$('btnAuto').classList.toggle('on',auto);$('btnAuto').innerHTML=auto?'<span>СТОП</span>':'<span>АВТО</span>'}
$('btnSpin').onclick=()=>{if(busy||!ready)return;onSpin()};
$('btnMinus').onclick=()=>{if(busy)return;sfx.click();betIdx=Math.max(0,betIdx-1);updUI()};
$('btnPlus').onclick=()=>{if(busy)return;sfx.click();betIdx=Math.min(BETS.length-1,betIdx+1);updUI()};
$('btnBuy').onclick=onBuy;
$('btnAuto').onclick=()=>{ac();auto=!auto;syncAuto();if(auto&&!busy&&ready)onSpin()};
$('btnTurbo').onclick=function(){turbo=!turbo;this.classList.toggle('on',turbo);sfx.click()};
$('btnSound').onclick=function(){snd=!snd;this.classList.toggle('on',snd);this.textContent=(snd?'🔊':'🔇')+' ЗВУК'};
$('btnRules').onclick=()=>{sfx.click();showRules()};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!busy&&ready&&!$('ov').classList.contains('show'))onSpin()}});
window.addEventListener('resize',()=>{layout()});

function initTG(){const tg=window.Telegram&&window.Telegram.WebApp;if(!tg)return;try{tg.ready();tg.expand();tg.setHeaderColor('#04121f');tg.setBackgroundColor('#04121f')}catch(e){}}
initTG();window.addEventListener('load',()=>{initTG();layout()});
updUI();layout();buildReels();
document.fonts&&document.fonts.ready.then(()=>layout());
</script>
