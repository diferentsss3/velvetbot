<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gold Rush Bandit</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rye&family=Rubik:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#2a1608;--paper:#f6e4b6;--gold:#ffc61a;--red:#c8321c;--org:#f08a24;--grn:#3a9b4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#8a3a14;color:var(--paper);font-family:Rubik,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ft{font-family:Bungee,Impact,sans-serif}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:rt 60s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.tw{animation:roll 14s linear infinite}
@keyframes roll{from{transform:translateX(-80px) rotate(0)}to{transform:translateX(560px) rotate(720deg)}}
header{position:relative;text-align:center;padding-top:6px}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:.95}
.logo small{font-family:Bungee;font-size:12px;letter-spacing:5px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.logo b{font-family:Rye,Bungee,serif;font-size:32px;color:var(--gold);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:1px}
#hud{position:relative;height:34px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px}
#msg{font-weight:900;font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink);text-align:center}
#msg.win{color:var(--gold);font-family:Bungee;font-size:18px}
#msg.fs{color:var(--ink);font-family:Bungee;font-size:12px;background:linear-gradient(#ffe27a,#ff9f1c);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:2px 12px}
#mult{font-family:Bungee;font-size:15px;color:#fff;background:linear-gradient(#e0553a,#962010);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:1px 12px}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.4) rotate(-4deg)}}
main{position:relative;flex:1;min-height:0;display:flex;padding:16px 8px 4px}
#frame{position:relative;flex:1;display:flex;padding:10px;border-radius:14px;background:repeating-linear-gradient(90deg,#a0662b 0 46px,#8a5420 46px 48px);border:5px solid var(--ink);box-shadow:0 0 0 3px var(--gold),0 0 36px rgba(255,198,26,.5),0 8px 0 rgba(0,0,0,.35)}
#frame.fs{box-shadow:0 0 0 3px #fff,0 0 54px rgba(255,255,255,.9),0 8px 0 rgba(0,0,0,.35)}
.plate{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:linear-gradient(#ffe27a,#f59e0b);color:var(--ink);border:4px solid var(--ink);border-radius:8px;padding:2px 14px;font-family:Bungee;font-size:12px;white-space:nowrap;box-shadow:0 3px 0 var(--ink);z-index:6}
#reels{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-radius:8px;background:var(--ink);padding:4px}
.col{display:flex;flex-direction:column;gap:4px;min-height:0}
.cell{position:relative;flex:1;min-height:0;padding:5%;display:flex;border-radius:7px;background:linear-gradient(#f9ecc8,#e2c37c);border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(160,102,43,.35)}
.cell svg{width:100%;height:100%;display:block;overflow:visible}
.cell.mv svg{filter:blur(1.4px);opacity:.75}
.cell.win{background:linear-gradient(#fff6b0,#ffd24d);box-shadow:0 0 0 2px #fff,0 0 14px var(--gold)}
.cell.win svg{animation:wig .5s ease-in-out infinite}
.cell.drop svg{animation:drop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes wig{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.14) rotate(-5deg)}70%{transform:scale(1.14) rotate(5deg)}}
@keyframes drop{from{transform:translateY(-130%)}}
footer{position:relative;padding:6px 12px 12px;background:linear-gradient(rgba(42,22,8,0),rgba(42,22,8,.95) 30%)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:10px;padding:3px 8px;text-align:center}
.stat span{display:block;font-size:10px;font-weight:900;letter-spacing:1px;opacity:.6}
.stat b{font-family:Bungee;font-size:17px;color:#962010}.stat.w b{color:#1f7a34}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.btn{border:4px solid var(--ink);border-radius:50%;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:Bungee;color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{width:50px;height:50px;font-size:26px;background:linear-gradient(#ffe27a,#f59e0b)}
.btn.info{width:44px;height:44px;font-size:20px;background:linear-gradient(#e7d7b0,#b08a4a)}
.btn.spin{width:88px;height:88px;background:radial-gradient(circle at 35% 30%,#ffb199,#e0553a 60%,#962010)}
.btn.spin svg{width:52px;height:52px}.btn.spin.go svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn:disabled{filter:grayscale(.8) brightness(.6);pointer-events:none}
.ov{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(30,14,4,.86);backdrop-filter:blur(3px);padding:20px}
.ov.show{display:flex}
.card{width:100%;max-width:380px;max-height:88%;overflow:auto;background:linear-gradient(#f9ecc8,#e2c37c);color:var(--ink);border:5px solid var(--ink);box-shadow:0 0 0 3px var(--gold),0 0 50px rgba(255,198,26,.5);border-radius:14px;padding:18px;text-align:center}
.card h2{font-family:Rye,Bungee,serif;font-size:26px;color:var(--red);margin-bottom:8px}
.card p{font-size:12.5px;line-height:1.45;margin:8px 0;text-align:left;font-weight:500}
.pt{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;text-align:left}
.pt svg{width:42px;height:42px}.pt .p{font-size:12px;font-weight:900}.pt i{font-style:normal;color:var(--red);font-family:Bungee}
.cta{background:linear-gradient(#b8ffcf,#3a9b4a);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:10px 26px;font-family:Bungee;font-size:16px;box-shadow:0 5px 0 var(--ink);margin-top:8px}
</style></head><body>
<div id="app">
<svg id="bg" viewBox="0 0 480 900" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8321c"/><stop offset=".4" stop-color="#f08a24"/><stop offset=".75" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffe9b0"/></linearGradient></defs>
<rect width="480" height="900" fill="url(#sk)"/>
<g class="rays" style="transform-origin:240px 650px" opacity=".18"><path d="M240 650L-200 300 -120 260Z M240 650L100 -100 180 -120Z M240 650L420 -100 500 -60Z M240 650L700 260 700 340Z" fill="#fff"/></g>
<circle cx="240" cy="650" r="110" fill="#fff3c4" opacity=".9"/>
<g fill="#8a3a14" stroke="#2a1608" stroke-width="3"><path d="M-10 720V660H40V620H120V670H170V720Z"/><path d="M300 720V640H350V590H430V630H490V720Z"/></g>
<g fill="#2a1608" opacity=".25"><rect x="40" y="640" width="60" height="6"/><rect x="350" y="610" width="60" height="6"/></g>
<path d="M0 740Q120 720 240 738T480 728V900H0Z" fill="#c9893f" stroke="#2a1608" stroke-width="3"/>
<g fill="#2a6b34" stroke="#2a1608" stroke-width="3"><path d="M410 780V730Q410 722 418 722Q426 722 426 730V780Z"/><path d="M410 760H398V744" fill="none" stroke-width="6"/><path d="M60 800V756Q60 748 68 748Q76 748 76 756V800Z"/></g>
<g class="tw"><circle cx="0" cy="820" r="16" fill="none" stroke="#7a4a1c" stroke-width="3"/><path d="M-12 812L12 828M-12 828L12 812M0 804V836" stroke="#7a4a1c" stroke-width="2.5"/></g>
<g fill="#fff" opacity=".5"><ellipse cx="90" cy="240" rx="54" ry="13"/><ellipse cx="400" cy="300" rx="64" ry="14"/></g>
</svg>
<header><div class="logo"><small>ЗОЛОТАЯ ЛИХОРАДКА</small><b>GOLD BANDIT</b></div></header>
<div id="hud"><div id="msg">Крути и намывай золото!</div><div id="mult">x1</div></div>
<main><div id="frame"><div class="plate" id="ways">ВЕТОК: 243</div><div id="reels"></div></div></main>
<footer>
<div class="stats"><div class="stat"><span>БАЛАНС</span><b id="bal">0</b></div><div class="stat"><span>СТАВКА</span><b id="bet">0</b></div><div class="stat w"><span>ВЫИГРЫШ</span><b id="win">0</b></div></div>
<div class="ctl"><button class="btn info" id="rules">i</button><button class="btn sm" id="minus">−</button>
<button class="btn spin" id="spin"><svg viewBox="0 0 48 48"><path d="M24 9a15 15 0 1 0 14 20" fill="none" stroke="#2a1608" stroke-width="7" stroke-linecap="round"/><path d="M20 -1L38 10 20 21Z" fill="#2a1608" stroke="#2a1608" stroke-width="3" stroke-linejoin="round"/></svg></button>
<button class="btn sm" id="plus">+</button><span style="width:44px"></span></div>
</footer>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
</div>
<script>
const I='#2a1608',st=(w=4)=>`stroke="${I}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const L=(t,c,f)=>`<text x="50" y="${50+f*.36}" text-anchor="middle" font-size="${f}" class="ft" fill="${c}" stroke="${I}" stroke-width="10" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
const ART={
B:`<path d="M14 40L18 10L44 26Z" fill="#8c97a6" ${st(4)}/><path d="M86 40L82 10L56 26Z" fill="#8c97a6" ${st(4)}/><ellipse cx="50" cy="58" rx="34" ry="28" fill="#aab4c2" ${st(5)}/><path d="M17 50Q50 38 83 50Q85 68 66 68Q56 58 50 64Q44 58 34 68Q15 68 17 50Z" fill="#2b2f3a"/><circle cx="36" cy="55" r="5.5" fill="#fff"/><circle cx="64" cy="55" r="5.5" fill="#fff"/><circle cx="37" cy="56" r="2.5" fill="${I}"/><circle cx="63" cy="56" r="2.5" fill="${I}"/><ellipse cx="50" cy="73" rx="14" ry="10" fill="#fff4d6" ${st(3)}/><ellipse cx="50" cy="67" rx="5" ry="3.5" fill="${I}"/><path d="M22 86Q50 102 78 86L72 78Q50 92 28 78Z" fill="#c8321c" ${st(3.5)}/><ellipse cx="50" cy="32" rx="40" ry="9" fill="#8a5420" ${st(4)}/><path d="M30 32Q30 6 50 6Q70 6 70 32Z" fill="#a0662b" ${st(4.5)}/><rect x="30" y="24" width="40" height="7" fill="#c8321c" ${st(3)}/>`,
G:`<rect x="6" y="28" width="62" height="18" rx="5" fill="#cfd8e3" ${st(4.5)}/><ellipse cx="62" cy="40" rx="20" ry="18" fill="#9aa7b8" ${st(4.5)}/><circle cx="62" cy="40" r="7" fill="${I}"/><path d="M58 54L82 60L90 94L66 98Z" fill="#a0662b" ${st(4.5)}/><path d="M46 52Q42 74 58 74" fill="none" ${st(8)}/><path d="M46 52Q42 74 58 74" fill="none" stroke="#cfd8e3" stroke-width="3"/><path d="M12 33H56" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>`,
N:`<path d="M12 62L26 32L52 20L80 32L92 58L78 84L36 88Z" fill="#ffc61a" ${st(5)}/><path d="M26 32L44 46L80 32M44 46L36 88M44 46L78 84M44 46L12 62" fill="none" stroke="#e0980a" stroke-width="3"/><path d="M28 40L46 28" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>`,
S:`<path d="M24 90V50Q24 14 50 14Q76 14 76 50V90" fill="none" stroke="${I}" stroke-width="24" stroke-linecap="round"/><path d="M24 90V50Q24 14 50 14Q76 14 76 50V90" fill="none" stroke="#cfd8e3" stroke-width="14" stroke-linecap="round"/><circle cx="24" cy="46" r="3" fill="${I}"/><circle cx="76" cy="46" r="3" fill="${I}"/><circle cx="32" cy="24" r="3" fill="${I}"/><circle cx="68" cy="24" r="3" fill="${I}"/><circle cx="50" cy="16" r="3" fill="${I}"/>`,
C:`<path d="M38 56H24Q14 56 14 44V30" fill="none" stroke="${I}" stroke-width="20" stroke-linecap="round"/><path d="M38 56H24Q14 56 14 44V30" fill="none" stroke="#3a9b4a" stroke-width="11" stroke-linecap="round"/><path d="M62 66H76Q86 66 86 54V38" fill="none" stroke="${I}" stroke-width="20" stroke-linecap="round"/><path d="M62 66H76Q86 66 86 54V38" fill="none" stroke="#3a9b4a" stroke-width="11" stroke-linecap="round"/><rect x="36" y="14" width="28" height="80" rx="14" fill="#3a9b4a" ${st(5)}/><path d="M50 20V90M43 24V86M57 24V86" stroke="#2a6b34" stroke-width="2.5"/><circle cx="50" cy="12" r="7" fill="#ff7aa8" ${st(3)}/>`,
A:L('A','#c8321c',66),K:L('K','#2a6b9a',66),Q:L('Q','#7a3a9a',66),J:L('J','#2a7a34',66),
W:`<polygon points="50,10 60.6,37.4 89.9,39 67.1,57.6 74.7,86 50,70 25.3,86 32.9,57.6 10.1,39 39.4,37.4" fill="#ffc61a" ${st(5)}/><g fill="#fff4d6" ${st(2.5)}><circle cx="50" cy="10" r="4"/><circle cx="90" cy="39" r="4"/><circle cx="75" cy="86" r="4"/><circle cx="25" cy="86" r="4"/><circle cx="10" cy="39" r="4"/></g><rect x="22" y="40" width="56" height="20" rx="6" fill="#c8321c" ${st(4)}/><text x="50" y="55" text-anchor="middle" font-size="13" class="ft" fill="#fff">WILD</text>`,
D:`<path d="M52 30Q56 12 70 10" fill="none" stroke="${I}" stroke-width="9" stroke-linecap="round"/><path d="M52 30Q56 12 70 10" fill="none" stroke="#e8d7a0" stroke-width="4" stroke-linecap="round"/><polygon points="76,2 80,9 88,8 82,14 86,22 78,18 72,24 72,16 66,10 74,9" fill="#ffc61a" ${st(2.5)}/><rect x="14" y="30" width="22" height="62" rx="6" fill="#c8321c" ${st(4.5)}/><rect x="39" y="30" width="22" height="62" rx="6" fill="#d9402a" ${st(4.5)}/><rect x="64" y="30" width="22" height="62" rx="6" fill="#c8321c" ${st(4.5)}/><rect x="10" y="50" width="80" height="22" rx="4" fill="#f6e4b6" ${st(4.5)}/><text x="50" y="68" text-anchor="middle" font-size="18" class="ft" fill="${I}">TNT</text>`};
const svg=k=>`<svg viewBox="0 0 100 100">${ART[k]}</svg>`;
const PAY={B:[.04,.12,.4],G:[.03,.09,.3],N:[.02,.07,.25],S:[.015,.05,.18],C:[.01,.03,.1],A:[.008,.025,.08],K:[.008,.025,.08],Q:[.006,.02,.06],J:[.006,.02,.06]},SYM=Object.keys(PAY);
const BAG='BBGGGNNNSSSSCCCCAAAKKKQQQJJJ',BETS=[10,20,50,100,200,500];
let bal=0,bi=1,fs=0,fsWin=0,inFS=false,fsMult=1,busy=false,g=[];
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),fmt=n=>Math.round(n).toLocaleString('ru-RU'),wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ================== ИНТЕГРАЦИЯ С VELVET ================== */
let INIT_DATA='',API_URL='https://personals-tournaments-featuring-towers.trycloudflare.com',ready=false;
async function apiCall(path,data={}){try{const r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...data,initData:INIT_DATA})});return await r.json()}catch(e){return{ok:false}}}
async function initFromServer(){if(!INIT_DATA)return;const r=await apiCall('/me');if(r.ok&&r.user){bal=Number(r.user.balance)||0;ready=true;ui()}else setTimeout(initFromServer,1000)}
async function syncServerBet(betAmount,winAmount){const r=await apiCall('/bet',{game:'slot',bet:betAmount,params:{win:winAmount,alreadyDeducted:true}});if(r.ok&&typeof r.balance==='number'){bal=r.balance;ui()}return r}
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='slot-init')return;if(e.data.initData)INIT_DATA=e.data.initData;if(e.data.apiUrl)API_URL=e.data.apiUrl;initFromServer()});
const _tg=window.Telegram&&window.Telegram.WebApp;if(_tg){try{_tg.ready();_tg.expand()}catch(e){}}
if(_tg&&_tg.initData){INIT_DATA=_tg.initData;initFromServer()}
/* ========================================================== */

const mk=c=>{const r=Math.random();if(c>0&&r<.06)return{s:'W'};if(r>.955)return{s:'D'};return{s:BAG[rnd(BAG.length)]}};
const cols=[],cells=[];
for(let c=0;c<5;c++){const col=document.createElement('div');col.className='col';cols[c]=col;cells[c]=[];$('reels').appendChild(col)}
function setRows(c,n){cols[c].innerHTML='';cells[c]=[];for(let r=0;r<n;r++){const d=document.createElement('div');d.className='cell';cols[c].appendChild(d);cells[c][r]=d}}
function draw(c,r,o,cls){const d=cells[c][r];d.className='cell'+(cls?' '+cls:'');d.innerHTML=svg(o.s)}
function ui(){$('bal').textContent=fmt(bal);$('bet').textContent=BETS[bi];$('frame').classList.toggle('fs',inFS);$('mult').textContent='x'+(inFS?fsMult:1)}
function setMsg(t,c){const m=$('msg');m.textContent=t;m.className=c||''}
function evalWays(bet){let total=0;const hit=new Set();for(const t of SYM){const cnt=[];for(let c=0;c<5;c++)cnt[c]=g[c].filter(o=>o.s===t||o.s==='W').length;let n=0,ways=1;while(n<5&&cnt[n]>0){ways*=cnt[n];n++}if(n<3)continue;total+=PAY[t][n-3]*ways*bet;for(let c=0;c<n;c++)g[c].forEach((o,r)=>{if(o.s===t||o.s==='W')hit.add(c+','+r)})}return{total,hit}}
async function spin(){
if(busy)return;
if(!ready){setMsg('Подключение...');return}
const wasFS=inFS;const bet=BETS[bi];
if(!inFS){if(bal<bet){setMsg('Недостаточно средств');return}bal-=bet}else fs--;
busy=true;$('spin').disabled=true;$('spin').classList.add('go');$('win').textContent=0;setMsg(inFS?`ФРИСПИНЫ: ${fs}`:'Ищем золото...',inFS?'fs':'');ui();
const rows=[...Array(5)].map(()=>2+rnd(5));
g=rows.map((n,c)=>Array.from({length:n},()=>mk(c)));
$('ways').textContent='ВЕТОК: '+fmt(rows.reduce((a,b)=>a*b,1));
for(let c=0;c<5;c++){setRows(c,rows[c])}
await Promise.all([0,1,2,3,4].map(c=>new Promise(res=>{const t=setInterval(()=>{for(let r=0;r<rows[c];r++)draw(c,r,{s:BAG[rnd(BAG.length)]},'mv')},70);setTimeout(()=>{clearInterval(t);for(let r=0;r<rows[c];r++)draw(c,r,g[c][r],'drop');res()},500+c*260)})));
const e=evalWays(bet);let total=e.total*(inFS?fsMult:1);
e.hit.forEach(k=>{const[c,r]=k.split(',');cells[c][r].classList.add('win')});
const sc=g.flat().filter(o=>o.s==='D').length;let trig=0;
if(sc>=3){total+=bet*(sc>=5?50:sc===4?10:2);trig=inFS?5:10;g.forEach((col,c)=>col.forEach((o,r)=>{if(o.s==='D')cells[c][r].classList.add('win')}))}
bal+=total;if(inFS)fsWin+=total;$('win').textContent=fmt(total);
if(trig){fs+=trig;if(!inFS){inFS=true;fsMult=1}setMsg(`ДИНАМИТ! +${trig} фриспинов`,'fs')}
else if(total)setMsg('ВЫИГРЫШ '+fmt(total)+'!','win');
else setMsg(inFS?`ФРИСПИНЫ: ${fs}`:'Пусто, копаем дальше',inFS?'fs':'');
if(inFS&&fsMult<10){fsMult++;ui();const m=$('mult');m.classList.remove('bump');void m.offsetWidth;m.classList.add('bump')}
if(inFS&&fs===0&&!trig){setMsg('Фриспины окончены: '+fmt(fsWin),'win');inFS=false;fsWin=0;fsMult=1}
ui();await syncServerBet(wasFS?0:bet,total);await wait(total?1300:350);

function rules(){let h='<h2>ПРАВИЛА</h2><div class="pt">';for(const k of SYM)h+=`${svg(k)}<div class="p">3 <i>${PAY[k][0]}</i> · 4 <i>${PAY[k][1]}</i> · 5 <i>${PAY[k][2]}</i></div>`;
