<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucky Panda Bao</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#3a0d12;--cream:#fff6dc;--red:#e0243a;--gold:#ffd24d;--org:#ff8a1f;--grn:#2dd4a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#7a1020;color:var(--cream);font-family:Rubik,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ft{font-family:Bungee,Impact,sans-serif}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%}
.pet{animation:fall 9s linear infinite}
@keyframes fall{from{transform:translate(0,-40px) rotate(0)}to{transform:translate(-60px,960px) rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
header{position:relative;text-align:center;padding-top:30px}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:.9}
.logo small{font-family:Bungee;font-size:13px;letter-spacing:3px;color:var(--gold);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.logo b{font-family:Bungee;font-size:36px;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 22px rgba(255,210,77,.8);letter-spacing:2px}
#hud{position:relative;height:36px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px}
#msg{font-weight:900;font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink);text-align:center}
#msg.win{color:var(--gold);font-family:Bungee;font-size:18px}
#msg.fs{color:var(--ink);font-family:Bungee;font-size:12px;background:linear-gradient(#ffe27a,#ff9f1c);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:2px 12px}
#mult{font-family:Bungee;font-size:16px;color:#fff;background:linear-gradient(#ff6b7d,#b3122a);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:1px 12px}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.4) rotate(-4deg)}}
main{position:relative;flex:1;min-height:0;display:flex;padding:14px 10px 4px}
#frame{position:relative;flex:1;display:flex;padding:10px;border-radius:26px;background:linear-gradient(#ffe27a,#ff9f1c);border:5px solid var(--ink);box-shadow:0 0 0 3px #ffb703,0 0 40px rgba(255,210,77,.6),0 8px 0 rgba(0,0,0,.3)}
#frame.fs{background:linear-gradient(#a7f3d0,#2dd4a0);box-shadow:0 0 0 3px #2dd4a0,0 0 50px rgba(45,212,160,.8),0 8px 0 rgba(0,0,0,.3)}
.plate{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:linear-gradient(#ff6b7d,#b3122a);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:2px 14px;font-family:Bungee;font-size:12px;white-space:nowrap;box-shadow:0 3px 0 var(--ink);z-index:6}
#reels{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-radius:16px;background:#9c1428;border:4px solid var(--ink);padding:6px}
.col{display:grid;grid-template-rows:repeat(3,1fr);gap:6px;min-height:0}
.cell{position:relative;min-height:0;padding:7%;display:flex;border-radius:14px;background:linear-gradient(#fff6dc,#ffd98a);border:3px solid var(--ink);box-shadow:inset 0 -4px 0 rgba(255,138,31,.35)}
.cell svg{width:100%;height:100%;display:block;overflow:visible}
.cell.mv svg{filter:blur(1.5px);opacity:.75}
.cell.lk{background:linear-gradient(#ffe9ee,#ff9fb4);box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold),inset 0 -4px 0 rgba(224,36,58,.3)}
.cell.lk svg{animation:bob 1s ease-in-out infinite alternate}
.cell.win{box-shadow:0 0 0 3px var(--grn),0 0 18px var(--grn)}
.cell.win svg{animation:wig .5s ease-in-out infinite}
.cell.drop svg{animation:drop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes bob{to{transform:translateY(-4%) scale(1.05)}}
@keyframes wig{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-5deg)}70%{transform:scale(1.12) rotate(5deg)}}
@keyframes drop{from{transform:translateY(-130%)}}
footer{position:relative;padding:6px 12px 12px;background:linear-gradient(rgba(122,16,32,0),rgba(90,10,24,.95) 30%)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:14px;padding:3px 8px;text-align:center}
.stat span{display:block;font-size:10px;font-weight:900;letter-spacing:1px;opacity:.6}
.stat b{font-family:Bungee;font-size:17px;color:#c4123a}.stat.w b{color:#0f8f6a}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.btn{border:4px solid var(--ink);border-radius:50%;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:Bungee;color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{width:50px;height:50px;font-size:26px;background:linear-gradient(#ffe27a,#ff9f1c)}
.btn.info{width:44px;height:44px;font-size:20px;background:linear-gradient(#c4f1ff,#3fa7d6)}
.btn.spin{width:90px;height:90px;background:radial-gradient(circle at 35% 30%,#ffe9a8,#ff8a1f 60%,#d95f00)}
.btn.spin svg{width:54px;height:54px}.btn.spin.go svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn:disabled{filter:grayscale(.8) brightness(.6);pointer-events:none}
.ov{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(40,4,14,.85);backdrop-filter:blur(3px);padding:20px}
.ov.show{display:flex}
.card{width:100%;max-width:380px;max-height:88%;overflow:auto;background:linear-gradient(#fff6dc,#ffd98a);color:var(--ink);border:5px solid var(--ink);box-shadow:0 0 0 3px var(--gold),0 0 50px rgba(255,210,77,.5);border-radius:24px;padding:18px;text-align:center}
.card h2{font-family:Bungee;font-size:26px;color:var(--red);margin-bottom:8px}
.card p{font-size:12.5px;line-height:1.45;margin:8px 0;text-align:left;font-weight:500}
.pt{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;text-align:left}
.pt svg{width:42px;height:42px}.pt .p{font-size:12px;font-weight:900}.pt i{font-style:normal;color:var(--red);font-family:Bungee}
.cta{background:linear-gradient(#b8ffe3,#2dd4a0);color:var(--ink);border:4px solid var(--ink);border-radius:16px;padding:10px 26px;font-family:Bungee;font-size:16px;box-shadow:0 5px 0 var(--ink);margin-top:8px}
</style></head><body>
<div id="app">
<svg id="bg" viewBox="0 0 480 900" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3122a"/><stop offset=".45" stop-color="#ff5a36"/><stop offset=".75" stop-color="#ffb347"/><stop offset="1" stop-color="#ffe09a"/></linearGradient></defs>

<g class="sway" style="transform-origin:300px 80px;animation-delay:-2s"><ellipse cx="300" cy="108" rx="22" ry="26" fill="#e0243a" stroke="#3a0d12" stroke-width="4"/><rect x="288" y="78" width="24" height="8" fill="#ffd24d" stroke="#3a0d12" stroke-width="3"/><rect x="288" y="130" width="24" height="8" fill="#ffd24d" stroke="#3a0d12" stroke-width="3"/></g>
<g class="sway" style="transform-origin:420px 56px;animation-delay:-.5s"><ellipse cx="420" cy="82" rx="20" ry="24" fill="#ff8a1f" stroke="#3a0d12" stroke-width="4"/><rect x="409" y="54" width="22" height="7" fill="#ffd24d" stroke="#3a0d12" stroke-width="3"/><rect x="409" y="102" width="22" height="7" fill="#ffd24d" stroke="#3a0d12" stroke-width="3"/></g>
<g fill="#ffc2d1"><ellipse class="pet" cx="90" cy="0" rx="6" ry="4"/><ellipse class="pet" cx="220" cy="0" rx="5" ry="3" style="animation-delay:-3s"/><ellipse class="pet" cx="340" cy="0" rx="6" ry="4" style="animation-delay:-6s"/><ellipse class="pet" cx="440" cy="0" rx="5" ry="3" style="animation-delay:-4.5s"/><ellipse class="pet" cx="150" cy="0" rx="4" ry="3" style="animation-delay:-7.5s"/></g>
</svg>
<header><div class="logo"><small>УДАЧЛИВАЯ</small><b>PANDA BAO</b></div></header>
<div id="hud"><div id="msg">Крути и лови удачу!</div><div id="mult">x1</div></div>
<main><div id="frame"><div class="plate">ПАНДА ЗАМИРАЕТ • РЕСПИНЫ</div><div id="reels"></div></div></main>
<footer>
<div class="stats"><div class="stat"><span>БАЛАНС</span><b id="bal">0</b></div><div class="stat"><span>СТАВКА</span><b id="bet">0</b></div><div class="stat w"><span>ВЫИГРЫШ</span><b id="win">0</b></div></div>
<div class="ctl"><button class="btn info" id="rules">i</button><button class="btn sm" id="minus">−</button>
<button class="btn spin" id="spin"><svg viewBox="0 0 48 48"><path d="M24 9a15 15 0 1 0 14 20" fill="none" stroke="#3a0d12" stroke-width="7" stroke-linecap="round"/><path d="M20 -1L38 10 20 21Z" fill="#3a0d12" stroke="#3a0d12" stroke-width="3" stroke-linejoin="round"/></svg></button>
<button class="btn sm" id="plus">+</button><span style="width:44px"></span></div>
</footer>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
</div>
<script>
const I='#3a0d12',st=(w=4)=>`stroke="${I}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const ART={
P:`<circle cx="22" cy="24" r="14" fill="${I}" ${st(3)}/><circle cx="78" cy="24" r="14" fill="${I}" ${st(3)}/><ellipse cx="50" cy="54" rx="35" ry="31" fill="#fff" ${st(5)}/><ellipse cx="33" cy="52" rx="9" ry="12" transform="rotate(20 33 52)" fill="${I}"/><ellipse cx="67" cy="52" rx="9" ry="12" transform="rotate(-20 67 52)" fill="${I}"/><circle cx="34" cy="50" r="4" fill="#fff"/><circle cx="66" cy="50" r="4" fill="#fff"/><circle cx="35" cy="50" r="2" fill="${I}"/><circle cx="65" cy="50" r="2" fill="${I}"/><ellipse cx="50" cy="63" rx="6" ry="4" fill="${I}"/><path d="M43 69Q50 77 57 69" fill="none" ${st(3)}/><circle cx="24" cy="66" r="6" fill="#ff8fb4" opacity=".7"/><circle cx="76" cy="66" r="6" fill="#ff8fb4" opacity=".7"/><path d="M18 36Q50 24 82 36L82 43Q50 31 18 43Z" fill="#e0243a" ${st(3.5)}/><circle cx="50" cy="32" r="6" fill="#ffd24d" ${st(3)}/><rect x="22" y="82" width="56" height="16" rx="7" fill="#ffd24d" ${st(4)}/><text x="50" y="95" text-anchor="middle" font-size="11" class="ft" fill="${I}">WILD</text>`,
B:`<path d="M50 20Q46 10 52 4M62 22Q60 14 66 8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/><path d="M10 66Q8 30 50 28Q92 30 90 66Q90 92 50 92Q10 92 10 66Z" fill="#ffd24d" ${st(5)}/><path d="M50 30L43 46M50 30L57 46M50 30L33 42M50 30L67 42" fill="none" ${st(3)}/><circle cx="50" cy="28" r="5" fill="#e0243a" ${st(3)}/><circle cx="36" cy="66" r="4" fill="${I}"/><circle cx="64" cy="66" r="4" fill="${I}"/><circle cx="28" cy="74" r="6" fill="#ff8fb4" opacity=".8"/><circle cx="72" cy="74" r="6" fill="#ff8fb4" opacity=".8"/><path d="M44 74Q50 80 56 74" fill="none" ${st(3)}/><path d="M24 50Q32 38 44 36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>`,
L:`<path d="M50 2V12" ${st(4)}/><rect x="34" y="10" width="32" height="10" rx="3" fill="#ffd24d" ${st(4)}/><ellipse cx="50" cy="52" rx="34" ry="32" fill="#e0243a" ${st(5)}/><path d="M50 20Q30 52 50 84M50 20Q70 52 50 84M50 20V84" fill="none" stroke="#ffd24d" stroke-width="3"/><rect x="34" y="80" width="32" height="10" rx="3" fill="#ffd24d" ${st(4)}/><path d="M50 90V98" ${st(4)}/><circle cx="50" cy="98" r="3" fill="#ffd24d"/><path d="M30 40Q34 30 42 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>`,
F:`<path d="M50 88L6 42Q50 2 94 42Z" fill="#ff6b8a" ${st(5)}/><path d="M50 88L20 28M50 88L36 14M50 88L50 10M50 88L64 14M50 88L80 28" fill="none" ${st(3)}/><path d="M6 42Q50 2 94 42" fill="none" stroke="#ffd24d" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="88" r="8" fill="#ffd24d" ${st(4)}/>`,
C:`<circle cx="50" cy="50" r="40" fill="#ffd24d" ${st(5)}/><circle cx="50" cy="50" r="31" fill="none" stroke="#f59e0b" stroke-width="4"/><rect x="38" y="38" width="24" height="24" rx="3" fill="${I}"/><path d="M24 36Q30 24 42 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>`,
T:`<ellipse cx="46" cy="62" rx="30" ry="26" fill="#2dd4a0" ${st(5)}/><path d="M24 44Q46 26 68 44Z" fill="#1fa57c" ${st(4)}/><circle cx="46" cy="28" r="6" fill="#ffd24d" ${st(3)}/><path d="M72 58Q94 56 92 34L82 38Q82 50 70 50Z" fill="#2dd4a0" ${st(4)}/><path d="M18 54Q2 58 8 74Q12 80 22 76" fill="none" ${st(9)}/><path d="M18 54Q2 58 8 74Q12 80 22 76" fill="none" stroke="#2dd4a0" stroke-width="3.5"/><path d="M26 56Q30 70 40 74" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>`,
G:`<rect x="24" y="6" width="22" height="88" rx="9" fill="#6fd34a" ${st(5)}/><rect x="54" y="16" width="20" height="78" rx="9" fill="#52b838" ${st(5)}/><path d="M24 34H46M24 64H46M54 40H74M54 70H74" ${st(3.5)}/><path d="M46 30Q70 20 84 6Q70 36 46 38Z" fill="#6fd34a" ${st(3)}/><path d="M74 54Q88 50 96 38Q90 60 74 62Z" fill="#52b838" ${st(3)}/>`,
I:`<path d="M4 38Q50 72 96 38L86 82Q50 96 14 82Z" fill="#ffd24d" ${st(5)}/><ellipse cx="50" cy="38" rx="42" ry="16" fill="#ffe9a8" ${st(5)}/><ellipse cx="50" cy="38" rx="22" ry="8" fill="#f59e0b"/><text x="50" y="82" text-anchor="middle" font-size="15" class="ft" fill="#e0243a" stroke="${I}" stroke-width="5" paint-order="stroke">FREE</text>`};
const svg=k=>`<svg viewBox="0 0 100 100">${ART[k]}</svg>`;
const PAY={B:50,L:20,F:12,C:8,T:5,G:3},SYM=Object.keys(PAY);
const BAG='BLLFFFCCCTTTGGGG',BETS=[10,20,50,100,200,500];
const LINES=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];

// === ИНТЕГРАЦИЯ С VELVET APP ===
let INIT_DATA='',API_URL='https://personals-tournaments-featuring-towers.trycloudflare.com',ready=false;
async function apiCall(path,data={}){try{const r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...data,initData:INIT_DATA})});return await r.json()}catch(e){return{ok:false}}}
async function initFromServer(){if(!INIT_DATA)return;const r=await apiCall('/me');if(r.ok&&r.user){bal=Number(r.user.balance)||0;ready=true;ui()}else setTimeout(initFromServer,1000)}
async function syncServerBet(betAmount,winAmount){const r=await apiCall('/bet',{game:'slot',bet:betAmount,params:{win:winAmount,alreadyDeducted:true}});if(r.ok&&typeof r.balance==='number'){bal=r.balance;ui()}return r}
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='slot-init')return;if(e.data.initData)INIT_DATA=e.data.initData;if(e.data.apiUrl)API_URL=e.data.apiUrl;initFromServer()});
const _tg=window.Telegram&&window.Telegram.WebApp;if(_tg){try{_tg.ready();_tg.expand()}catch(e){}}
if(_tg&&_tg.initData){INIT_DATA=_tg.initData;initFromServer()}
// === КОНЕЦ ИНТЕГРАЦИИ ===

let bal=10000,bi=1,fs=0,fsWin=0,inFS=false,mult=1,busy=false,g=[],lock=[];
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),fmt=n=>Math.round(n).toLocaleString('ru-RU'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const mk=()=>{const r=Math.random();return{s:r<(inFS?.11:.08)?'P':r<(inFS?.14:.115)?'I':BAG[rnd(BAG.length)]}};
const cells=[];
for(let c=0;c<3;c++){const col=document.createElement('div');col.className='col';cells[c]=[];lock[c]=[false,false,false];for(let r=0;r<3;r++){const d=document.createElement('div');d.className='cell';col.appendChild(d);cells[c][r]=d}$('reels').appendChild(col)}
function draw(c,r,o,cls){const d=cells[c][r];d.className='cell'+(lock[c][r]?' lk':'')+(cls?' '+cls:'');d.innerHTML=svg(o.s)}
function ui(){$('bal').textContent=fmt(bal);$('bet').textContent=BETS[bi];$('frame').classList.toggle('fs',inFS);$('mult').textContent='x'+mult}
function bump(){const m=$('mult');m.classList.remove('bump');void m.offsetWidth;m.classList.add('bump')}
function setMsg(t,c){const m=$('msg');m.textContent=t;m.className=c||''}
function roll(list,base){return Promise.all(list.map(([c,r])=>new Promise(res=>{const t=setInterval(()=>draw(c,r,{s:BAG[rnd(BAG.length)]},'mv'),70);setTimeout(()=>{clearInterval(t);draw(c,r,g[c][r],'drop');res()},base+c*200+r*60)})))}
function lines(bet){let w=0;const hit=new Set(),per=bet/5;
for(const Ln of LINES){const l=Ln.map((r,c)=>g[c][r]);if(l.some(o=>o.s==='I'))continue;const b=l.find(o=>o.s!=='P');const base=b?b.s:'B';if(!l.every(o=>o.s===base||o.s==='P'))continue;w+=PAY[base]*per;Ln.forEach((r,c)=>hit.add(c+','+r))}return{w,hit}}
async function spin(){
  if(busy)return;
  const bet=BETS[bi];
  if(!ready){setMsg('Подключение...');return}
  const wasFS=inFS;
  if(!inFS){if(bal<bet){setMsg('Недостаточно кредитов');return}bal-=bet}else fs--;
  busy=true;$('spin').disabled=true;$('spin').classList.add('go');$('win').textContent=0;mult=inFS?2:1;
  for(let c=0;c<3;c++)lock[c]=[false,false,false];
  setMsg(inFS?`ФРИСПИНЫ: ${fs}`:'Удачи!',inFS?'fs':'');ui();
  const all=[];for(let c=0;c<3;c++){g[c]=[];for(let r=0;r<3;r++){g[c][r]=mk();all.push([c,r])}}
  await roll(all,450);
  let rounds=0;
  for(;;){const nw=[];for(let c=0;c<3;c++)for(let r=0;r<3;r++)if(!lock[c][r]&&g[c][r].s==='P')nw.push([c,r]);
  if(!nw.length)break;
  nw.forEach(([c,r])=>{lock[c][r]=true;draw(c,r,g[c][r])});
  if(rounds>0){mult+=nw.length;ui();bump()}
  const fr=[];for(let c=0;c<3;c++)for(let r=0;r<3;r++)if(!lock[c][r])fr.push([c,r]);
  if(!fr.length||rounds>=5)break;
  rounds++;setMsg(`ПАНДА ЗАМЕРЛА! РЕСПИН ${rounds}`,'win');await wait(750);
  fr.forEach(([c,r])=>g[c][r]=mk());await roll(fr,350)}
  let total=0,jp=false;
  const pc=g.flat().filter(o=>o.s==='P').length;
  if(pc===9){jp=true;total=bet*100}
  else{const e=lines(bet);total=e.w*mult;e.hit.forEach(k=>{const[c,r]=k.split(',');cells[c][r].classList.add('win')})}
  const sc=g.flat().filter(o=>o.s==='I').length;let trig=0;
  if(sc>=3){total+=bet*(sc>=5?20:sc===4?5:2);trig=inFS?4:8;g.forEach((col,c)=>col.forEach((o,r)=>{if(o.s==='I')cells[c][r].classList.add('win')}))}
  bal+=total;if(inFS)fsWin+=total;$('win').textContent=fmt(total);
  if(trig){fs+=trig;inFS=true;setMsg(`СЛИТКИ! +${trig} фриспинов`,'fs')}
  else if(jp)setMsg('ПАНДА-ДЖЕКПОТ '+fmt(total)+'!','win');
  else if(total)setMsg('ВЫИГРЫШ '+fmt(total)+'!','win');
  else setMsg(inFS?`ФРИСПИНЫ: ${fs}`:'Пока пусто, крути ещё',inFS?'fs':'');
  if(inFS&&fs===0&&!trig){setMsg('Фриспины окончены: '+fmt(fsWin),'win');inFS=false;fsWin=0}
  ui();
  await syncServerBet(wasFS?0:bet,total);
  await wait(total?1400:400);
  busy=false;$('spin').disabled=false;$('spin').classList.remove('go');if(inFS&&fs>0)spin()}
function rules(){let h='<h2>ПРАВИЛА</h2><div class="pt">';for(const k of SYM)h+=`${svg(k)}<div class="p">3 в линии: <i>x${PAY[k]}</i> ставки на линию</div>`;
h+=`${svg('P')}<div class="p">ПАНДА (WILD): заменяет все символы, кроме слитка, замирает на месте и запускает респин</div>${svg('I')}<div class="p">3+ СЛИТКА: выплата и 8 фриспинов (повтор +4)</div></div><p><b>Линии:</b> 5 линий, 3 символа подряд (3 горизонтали и 2 диагонали). Ставка делится на 5 линий.</p><p><b>Респины:</b> каждая панда замирает, остальные ячейки крутятся заново. Новые панды в респине прибавляют +1 к множителю каждая (максимум 5 респинов). Выплата считается после последнего респина.</p><p><b>Джекпот:</b> 9 панд на поле дают x100 ставки. Фриспины стартуют с множителем x2.</p><button class="cta" id="ok">ОК</button>`;
$('card').innerHTML=h;$('ov').classList.add('show');$('ok').onclick=()=>$('ov').classList.remove('show')}
$('spin').onclick=spin;$('rules').onclick=rules;
$('plus').onclick=()=>{if(!busy&&!inFS&&bi<BETS.length-1){bi++;ui()}};
$('minus').onclick=()=>{if(!busy&&!inFS&&bi>0){bi--;ui()}};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();spin()}});
for(let c=0;c<3;c++){g[c]=[];for(let r=0;r<3;r++){g[c][r]={s:BAG[rnd(BAG.length)]};draw(c,r,g[c][r])}}ui();
