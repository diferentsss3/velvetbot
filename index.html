<style>
:root{--bg:#07051f;--c:rgba(255,255,255,.05);--c2:rgba(255,255,255,.07);--ln:rgba(255,255,255,.1);--t:#f5f2ff;--m:#9b93cf;--g:#c19bff;--ok:#4ade80;--bad:#ff5470;--sat:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));--hd:'Unbounded',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 38% at 90% -6%,rgba(139,61,255,.5),transparent 70%),radial-gradient(55% 32% at -5% 58%,rgba(214,70,255,.2),transparent 70%),radial-gradient(70% 40% at 100% 100%,rgba(60,90,255,.25),transparent 70%)}
body{max-width:480px;margin:0 auto;color:var(--t);font:500 15px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none;touch-action:manipulation;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) 14px 10px;background:rgba(7,5,31,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--ln)}
h1{font:700 17px var(--hd);margin:0;letter-spacing:.01em}
.lg{font:700 15px var(--hd);font-style:normal;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#7b2ff7,#c04dff);display:grid;place-items:center;color:#fff;box-shadow:0 4px 16px rgba(139,61,255,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.chip{background:linear-gradient(135deg,rgba(123,47,247,.38),rgba(176,77,255,.18));border:1px solid rgba(193,155,255,.35);border-radius:22px;padding:4px 4px 4px 10px;display:flex;gap:8px;align-items:center;font:700 14px var(--hd);color:#fff}
.chip::before{content:"";width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff6c4,#ffd24a 45%,#e09a12);box-shadow:0 0 10px rgba(255,200,60,.5)}
.chip b{background:linear-gradient(135deg,#8b3dff,#c04dff);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font:700 18px system-ui}
main{padding:14px 14px 0}
.tab{display:none}.tab.on{display:block}
.card{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 12px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{width:100%;min-height:52px;padding:14px;border-radius:15px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#7b2ff7,#b84dff);box-shadow:0 10px 26px rgba(123,47,247,.5),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;box-shadow:none}
.bet{display:flex;gap:6px;margin-bottom:12px}
input,select{flex:1;min-width:0;width:100%;height:46px;background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:13px;color:var(--t);padding:0 12px;font:700 16px Manrope,system-ui,sans-serif;outline:0}
.bet button{background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:13px;padding:0 13px;font-weight:700;min-width:46px}
label{display:block;color:var(--m);font-size:12px;font-weight:600;margin-bottom:6px}
.sh{margin:8px 4px 10px;font:700 13px var(--hd);display:flex;align-items:center}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;display:flex;gap:2px;padding:6px;border-radius:26px;background:rgba(18,12,56,.78);backdrop-filter:blur(18px);border:1px solid var(--ln);z-index:10}
nav button{flex:1;min-height:52px;border-radius:20px;background:none;color:var(--m);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
nav .on{color:#fff;background:linear-gradient(135deg,rgba(123,47,247,.6),rgba(176,77,255,.32))}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mc{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--ln);border-radius:20px;padding:7px 7px 12px;text-align:center;cursor:pointer}
.mc .pn{height:clamp(74px,22vw,96px);border-radius:15px;display:grid;place-items:center;font-size:clamp(38px,11vw,48px)}
.pn span{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.m1{background:radial-gradient(120% 90% at 50% 130%,#d58bff,transparent 62%),linear-gradient(145deg,#4a14c2,#8b3dff)}
.m2{background:radial-gradient(120% 90% at 50% 130%,#ffa0d6,transparent 62%),linear-gradient(145deg,#8e1aa8,#ec4899)}
.m3{background:radial-gradient(120% 90% at 50% 130%,#7be0ff,transparent 62%),linear-gradient(145deg,#2a2fc9,#3b82f6)}
.m4{background:radial-gradient(120% 90% at 50% 130%,#ffe08a,transparent 62%),linear-gradient(145deg,#b8620a,#f59e0b)}
.m5{background:radial-gradient(120% 90% at 50% 130%,#7bf0c0,transparent 62%),linear-gradient(145deg,#0f766e,#22c55e)}
.m6{background:radial-gradient(120% 90% at 50% 130%,#ffd08a,transparent 62%),linear-gradient(145deg,#c2410c,#f59e0b)}
/* ... (остальные стили для игр я не трогаю, они подтянутся сами) ... */
