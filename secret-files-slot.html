<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Secret Files</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#070a18;--bone:#f4ecd6;--red:#e0243a;--amb:#ffb703;--bl:#3fa7d6;--gr:#2dd4a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--bone);font-family:Rubik,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ft{font-family:Bungee,Impact,sans-serif}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%}
.beam{transform-box:fill-box;transform-origin:50% 100%;animation:sw 7s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
header{position:relative;text-align:center;padding-top:6px}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:.9}
.logo small{font-family:Bungee;font-size:12px;letter-spacing:2px;color:var(--red);background:var(--bone);border:3px solid var(--red);border-radius:6px;padding:1px 8px;transform:rotate(-4deg);margin-bottom:-2px;position:relative;z-index:1}
.logo b{font-family:Bungee;font-size:36px;color:var(--amb);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 24px rgba(255,183,3,.6);letter-spacing:3px}
#hud{position:relative;height:34px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px}
#msg{font-weight:900;font-size:14px;text-shadow:0 2px 0 var(--ink);text-align:center}
#msg.win{color:var(--gr);font-family:Bungee;font-size:18px}
#msg.fs{color:var(--ink);font-family:Bungee;font-size:12px;background:linear-gradient(#ffd24d,#f59e0b);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:2px 12px}
#mult{font-family:Bungee;font-size:16px;background:linear-gradient(#ff6b7d,#b3122a);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:1px 12px}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.4) rotate(-4deg)}}
main{position:relative;flex:1;min-height:0;display:flex;padding:16px 8px 4px}
#frame{position:relative;flex:1;display:flex;padding:8px;border-radius:22px;background:linear-gradient(#1f2a4d,#0e1530);border:5px solid var(--ink);box-shadow:0 0 0 3px var(--amb),0 0 44px rgba(224,36,58,.45),0 8px 0 rgba(0,0,0,.35)}
#frame.fs{box-shadow:0 0 0 3px var(--gr),0 0 54px rgba(45,212,160,.7),0 8px 0 rgba(0,0,0,.35)}
.plate{position:absolute;top:-17px;left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--red);color:var(--bone);border:4px solid var(--ink);border-radius:8px;padding:2px 14px;font-family:Bungee;font-size:12px;white-space:nowrap;box-shadow:0 3px 0 var(--ink);z-index:6}
#reels{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;border-radius:14px;overflow:hidden;background:var(--ink);padding:3px}
.col{display:grid;grid-template-rows:repeat(3,1fr);gap:3px;min-height:0;overflow:hidden;background:linear-gradient(#18224a,#0b1128);border-radius:8px}
.cell{position:relative;min-height:0;padding:6%;display:flex}
.cell svg{width:100%;height:100%;display:block;overflow:visible}
.cell.mv svg{filter:blur(1.5px);opacity:.75}
.cell.wd{background:radial-gradient(circle,rgba(224,36,58,.4),rgba(224,36,58,0) 70%)}
.cell.sec{background:radial-gradient(circle,rgba(255,183,3,.45),rgba(255,183,3,0) 70%)}
.cell.sec svg{animation:wig .4s ease-in-out infinite}
.cell.win{background:radial-gradient(circle,rgba(45,212,160,.42),rgba(45,212,160,0) 70%)}
.cell.win svg{animation:wig .5s ease-in-out infinite}
.cell.flip svg{animation:flip .55s ease-out}
.cell.drop svg{animation:drop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes wig{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.14) rotate(-5deg)}70%{transform:scale(1.14) rotate(5deg)}}
@keyframes flip{from{transform:rotateY(90deg) scale(.5)}}
@keyframes drop{from{transform:translateY(-130%)}}
footer{position:relative;padding:6px 12px 12px;background:linear-gradient(rgba(7,10,24,0),rgba(7,10,24,.94) 30%)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:#18224a;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--red),0 3px 0 var(--ink);border-radius:14px;padding:3px 8px;text-align:center}
.stat span{display:block;font-size:10px;font-weight:900;letter-spacing:1px;opacity:.7}
.stat b{font-family:Bungee;font-size:17px;color:var(--amb)}.stat.w b{color:var(--gr)}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.btn{border:4px solid var(--ink);border-radius:50%;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:Bungee;color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{width:50px;height:50px;font-size:26px;background:linear-gradient(#ff6b7d,#b3122a);color:var(--bone)}
.btn.info{width:44px;height:44px;font-size:20px;background:linear-gradient(#8ed1ff,#2b78b8);color:var(--bone)}
.btn.spin{width:86px;height:86px;background:radial-gradient(circle at 35% 30%,#b8ffe3,#2dd4a0 60%,#0f8f6a)}
.btn.spin svg{width:52px;height:52px}.btn.spin.go svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn:disabled{filter:grayscale(.8) brightness(.6);pointer-events:none}
.ov{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(4,6,16,.84);backdrop-filter:blur(3px);padding:20px}
.ov.show{display:flex}
.card{width:100%;max-width:380px;max-height:88%;overflow:auto;background:linear-gradient(#1f2a4d,#0e1530);border:5px solid var(--ink);box-shadow:0 0 0 3px var(--amb),0 0 50px rgba(255,183,3,.35);border-radius:24px;padding:18px;text-align:center}
.card h2{font-family:Bungee;font-size:26px;color:var(--amb);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin-bottom:8px}
.card p{font-size:12.5px;line-height:1.45;color:#e2dcc6;margin:8px 0;text-align:left}
.pt{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;text-align:left}
.pt svg{width:42px;height:42px}.pt .p{font-size:12px;font-weight:900}.pt i{font-style:normal;color:var(--amb);font-family:Bungee}
.cta{background:linear-gradient(#b8ffe3,#2dd4a0);color:var(--ink);border:4px solid var(--ink);border-radius:16px;padding:10px 26px;font-family:Bungee;font-size:16px;box-shadow:0 5px 0 var(--ink);margin-top:8px}
</style></head><body>
<div id="app">
<svg id="bg" viewBox="0 0 480 900" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2350"/><stop offset=".55" stop-color="#0d1233"/><stop offset="1" stop-color="#070a18"/></linearGradient>
<linearGradient id="bm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".35"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient></defs>
<rect width="480" height="900" fill="url(#nt)"/>
<circle cx="90" cy="120" r="34" fill="#f4ecd6" stroke="#070a18" stroke-width="4"/><circle cx="80" cy="110" r="6" fill="#d9cfae"/>
<g class="beam"><path d="M330 880L250 40 410 40Z" fill="url(#bm)"/></g>
<g fill="#0b1030" stroke="#070a18" stroke-width="3"><rect x="-10" y="640" width="90" height="260"/><rect x="70" y="600" width="70" height="300"/><rect x="130" y="680" width="100" height="220"/><rect x="225" y="620" width="80" height="280"/><rect x="300" y="670" width="90" height="230"/><rect x="385" y="590" width="105" height="310"/></g>
<g fill="#ffb703" opacity=".85"><rect x="90" y="620" width="8" height="10"/><rect x="110" y="650" width="8" height="10"/><rect x="20" y="670" width="8" height="10"/><rect x="40" y="720" width="8" height="10"/><rect x="245" y="650" width="8" height="10"/><rect x="270" y="700" width="8" height="10"/><rect x="330" y="700" width="8" height="10"/><rect x="410" y="620" width="8" height="10"/><rect x="440" y="680" width="8" height="10"/><rect x="160" y="710" width="8" height="10"/></g>
<path d="M0 840Q120 820 240 835T480 828V900H0Z" fill="#070a18"/>
</svg>
<header><div class="logo"><small>TOP SECRET</small><b>SECRET</b></div></header>
<div id="hud"><div id="msg">Вскрой секретное досье!</div><div id="mult">x1</div></div>
<main><div id="frame"><div class="plate">243 ЛИНИИ • СЕКРЕТНЫЙ СИМВОЛ</div><div id="reels"></div></div></main>
<footer>
<div class="stats"><div class="stat"><span>БАЛАНС</span><b id="bal">0</b></div><div class="stat"><span>СТАВКА</span><b id="bet">0</b></div><div class="stat w"><span>ВЫИГРЫШ</span><b id="win">0</b></div></div>
<div class="ctl"><button class="btn info" id="rules">i</button><button class="btn sm" id="minus">−</button>
<button class="btn spin" id="spin"><svg viewBox="0 0 48 48"><path d="M24 9a15 15 0 1 0 14 20" fill="none" stroke="#070a18" stroke-width="7" stroke-linecap="round"/><path d="M20 -1L38 10 20 21Z" fill="#070a18" stroke="#070a18" stroke-width="3" stroke-linejoin="round"/></svg></button>
<button class="btn sm" id="plus">+</button><span style="width:44px"></span></div>
</footer>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
</div>
<script>
const I='#070a18',st=(w=4)=>`stroke="${I}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const L=(t,c,f)=>`<text x="50" y="${50+f*.36}" text-anchor="middle" font-size="${f}" class="ft" fill="${c}" stroke="${I}" stroke-width="10" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
const ART={
H:`<circle cx="50" cy="62" r="26" fill="#ffcf9e" ${st()}/><path d="M32 40L36 12Q50 4 64 12L68 40Z" fill="#39426b" ${st()}/><path d="M33 34H67V40H33Z" fill="#e0243a" ${st(3)}/><ellipse cx="50" cy="40" rx="40" ry="9" fill="#39426b" ${st()}/><rect x="26" y="52" width="22" height="14" rx="6" fill="${I}"/><rect x="52" y="52" width="22" height="14" rx="6" fill="${I}"/><path d="M48 58H52" ${st(3)}/><path d="M30 56L38 54M56 56L64 54" stroke="#8ed1ff" stroke-width="3" stroke-linecap="round"/><path d="M40 78Q50 84 60 78" fill="none" ${st(3)}/><path d="M34 88L50 96L66 88L62 84H38Z" fill="#f4ecd6" ${st(3)}/>`,
B:`<path d="M36 34V22Q36 14 44 14H56Q64 14 64 22V34" fill="none" ${st(9)}/><path d="M36 34V22Q36 14 44 14H56Q64 14 64 22V34" fill="none" stroke="#a96a22" stroke-width="3.5"/><rect x="10" y="32" width="80" height="54" rx="9" fill="#c97b2a" ${st(5)}/><path d="M10 56H90" ${st(3.5)}/><rect x="42" y="50" width="16" height="14" rx="3" fill="#ffd24d" ${st(3)}/><circle cx="22" cy="46" r="3" fill="#ffd24d"/><circle cx="78" cy="46" r="3" fill="#ffd24d"/>`,
Y:`<g transform="rotate(-35 50 50)"><rect x="42" y="42" width="52" height="16" rx="4" fill="#ffd24d" ${st(4)}/><rect x="72" y="56" width="8" height="14" fill="#ffd24d" ${st(3)}/><rect x="84" y="56" width="8" height="10" fill="#ffd24d" ${st(3)}/><circle cx="30" cy="50" r="22" fill="#ffd24d" ${st(5)}/><circle cx="30" cy="50" r="9" fill="${I}"/></g>`,
M:`<path d="M62 62L88 88" ${st(16)}/><path d="M62 62L88 88" stroke="#a96a22" stroke-width="8" stroke-linecap="round"/><circle cx="42" cy="42" r="28" fill="#8ed1ff" ${st(5)}/><circle cx="42" cy="42" r="28" fill="none" stroke="#ffd24d" stroke-width="5"/><path d="M26 36Q32 24 44 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`,
A:L('A','#e0243a',66),K:L('K','#3fa7d6',66),Q:L('Q','#2dd4a0',66),J:L('J','#ffb703',66),
W:`<g transform="rotate(-10 50 50)"><rect x="6" y="26" width="88" height="48" rx="8" fill="#e0243a" ${st(5)}/><rect x="12" y="32" width="76" height="36" rx="5" fill="none" stroke="#f4ecd6" stroke-width="3"/><text x="50" y="52" text-anchor="middle" font-size="19" class="ft" fill="#f4ecd6">WILD</text><text x="50" y="64" text-anchor="middle" font-size="8" class="ft" fill="#f4ecd6">SECRET</text></g>`,
V:`<rect x="12" y="14" width="76" height="72" rx="10" fill="#6b7aa8" ${st(5)}/><rect x="22" y="24" width="56" height="52" rx="6" fill="#8a99c4" ${st(3.5)}/><circle cx="50" cy="50" r="15" fill="#ffd24d" ${st(4)}/><path d="M50 38V62M38 50H62M41 41L59 59M59 41L41 59" ${st(2.5)}/><circle cx="50" cy="50" r="4" fill="${I}"/><rect x="20" y="86" width="12" height="8" fill="${I}"/><rect x="68" y="86" width="12" height="8" fill="${I}"/>`,
'?':`<path d="M10 30Q10 22 18 22H38L46 32H82Q90 32 90 40V82Q90 90 82 90H18Q10 90 10 82Z" fill="#f2c94c" ${st(5)}/><path d="M10 44H90" stroke="#d9a92b" stroke-width="3"/><text x="50" y="78" text-anchor="middle" font-size="46" class="ft" fill="#e0243a" stroke="${I}" stroke-width="7" paint-order="stroke">?</text>`};
const svg=k=>`<svg viewBox="0 0 100 100">${ART[k]}</svg>`;
const PAY={H:[.08,.3,1],B:[.06,.2,.7],Y:[.05,.15,.5],M:[.04,.12,.4],A:[.02,.06,.2],K:[.02,.06,.2],Q:[.015,.05,.15],J:[.015,.05,.15]},REG=Object.keys(PAY);
const BAG='HHBBBYYYMMMMAAAAKKKKQQQQJJJJ',BETS=[10,20,50,100,200,500];
let bal=0,bi=1,fs=0,fsWin=0,inFS=false,mult=1,busy=false,g=[];
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),fmt=n=>Math.round(n).toLocaleString('ru-RU'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const mk=()=>{const r=Math.random();return{s:r<.07?'?':r<.09?'V':r<.12?'W':BAG[rnd(BAG.length)]}};
const cells=[];
for(let c=0;c<5;c++){const col=document.createElement('div');col.className='col';cells[c]=[];for(let r=0;r<3;r++){const d=document.createElement('div');d.className='cell';col.appendChild(d);cells[c][r]=d}$('reels').appendChild(col)}
function draw(c,r,o,cls){const d=cells[c][r];d.className='cell'+(o.s==='W'?' wd':'')+(o.s==='?'?' sec':'')+(cls?' '+cls:'');d.innerHTML=svg(o.s)}
function ui(){$('bal').textContent=fmt(bal);$('bet').textContent=BETS[bi];$('frame').classList.toggle('fs',inFS);$('mult').textContent='x'+mult}
function setMsg(t,c){const m=$('msg');m.textContent=t;m.className=c||''}

/* ================== ИНТЕГРАЦИЯ С VELVET ================== */
let INIT_DATA='',API_URL='https://personals-tournaments-featuring-towers.trycloudflare.com',ready=false;
async function apiCall(path,data={}){try{const r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...data,initData:INIT_DATA})});return await r.json()}catch(e){return{ok:false}}}
async function initFromServer(){if(!INIT_DATA)return;const r=await apiCall('/me');if(r.ok&&r.user){bal=Number(r.user.balance)||0;ready=true;ui()}else setTimeout(initFromServer,1000)}
async function syncServerBet(betAmount,winAmount){const r=await apiCall('/bet',{game:'slot',bet:betAmount,params:{win:winAmount,alreadyDeducted:true}});if(r.ok&&typeof r.balance==='number'){bal=r.balance;ui()}return r}
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='slot-init')return;if(e.data.initData)INIT_DATA=e.data.initData;if(e.data.apiUrl)API_URL=e.data.apiUrl;initFromServer()});
const _tg=window.Telegram&&window.Telegram.WebApp;if(_tg){try{_tg.ready();_tg.expand()}catch(e){}}
if(_tg&&_tg.initData){INIT_DATA=_tg.initData;initFromServer()}
/* ========================================================== */

function ways(bet){let w=0;const hit=new Set();for(const t of REG){const cnt=[];for(let c=0;c<5;c++)cnt[c]=g[c].filter(o=>o.s===t||o.s==='W').length;let n=0,ws=1;while(n<5&&cnt[n]>0){ws*=cnt[n];n++}if(n<3)continue;w+=PAY[t][n-3]*bet*ws;for(let c=0;c<n;c++)g[c].forEach((o,r)=>{if(o.s===t||o.s==='W')hit.add(c+','+r)})}return{w,hit}}
async function spin(){if(busy)return;
if(!ready){setMsg('Подключение...');return}
const bet=BETS[bi];const wasFS=inFS;
if(!inFS){if(bal<bet){setMsg('Недостаточно средств');return}bal-=bet}else fs--;
busy=true;$('spin').disabled=true;$('spin').classList.add('go');$('win').textContent=0;mult=1;setMsg(inFS?`ФРИСПИНЫ: ${fs}`:'Ищем улики...',inFS?'fs':'');ui();
g=[];for(let c=0;c<5;c++){g[c]=[];for(let r=0;r<3;r++)g[c][r]=mk()}
await Promise.all([0,1,2,3,4].map(c=>new Promise(res=>{const t=setInterval(()=>{for(let r=0;r<3;r++)draw(c,r,{s:BAG[rnd(BAG.length)]},'mv')},70);setTimeout(()=>{clearInterval(t);for(let r=0;r<3;r++)draw(c,r,g[c][r],'drop');res()},500+c*260)})));
const sec=[];let sc=0;g.forEach((col,c)=>col.forEach((o,r)=>{if(o.s==='?')sec.push([c,r]);if(o.s==='V')sc++}));
if(sec.length){setMsg(`СЕКРЕТОВ: ${sec.length}. Вскрываем досье...`);await wait(1000);
const bag=inFS?'HHHBBYYMW':'HHBBYYMMAAKKQJ',rs=bag[rnd(bag.length)];
sec.forEach(([c,r])=>{g[c][r]={s:rs};draw(c,r,g[c][r],'flip')});
mult=sec.length>=6?3:sec.length>=4?2:1;ui();if(mult>1){$('mult').classList.remove('bump');void $('mult').offsetWidth;$('mult').classList.add('bump')}
setMsg(mult>1?`СЕКРЕТ РАСКРЫТ! МНОЖИТЕЛЬ x${mult}`:'СЕКРЕТ РАСКРЫТ!','win');await wait(900)}
const e=ways(bet);let total=e.w*mult;
e.hit.forEach(k=>{const[c,r]=k.split(',');cells[c][r].classList.add('win')});
let trig=0;if(sc>=3){total+=bet*(sc>=5?50:sc===4?10:2);trig=inFS?5:8}
bal+=total;if(inFS)fsWin+=total;$('win').textContent=fmt(total);
if(trig){fs+=trig;inFS=true;setMsg(`СЕЙФ ВСКРЫТ! +${trig} фриспинов`,'fs')}
else if(total)setMsg('ВЫИГРЫШ '+fmt(total)+'!','win');else setMsg(inFS?`ФРИСПИНЫ: ${fs}`:'Пусто, ищем дальше',inFS?'fs':'');
if(inFS&&fs===0&&!trig){setMsg('Фриспины окончены: '+fmt(fsWin),'win');inFS=false;fsWin=0}
ui();
await syncServerBet(wasFS?0:bet, total);
await wait(total?1300:350);
busy=false;$('spin').disabled=false;$('spin').classList.remove('go');if(inFS&&fs>0)spin()}
function rules(){let h='<h2>ПРАВИЛА</h2><div class="pt">';for(const k of REG)h+=`${svg(k)}<div class="p">3 <i>${PAY[k][0]}</i> · 4 <i>${PAY[k][1]}</i> · 5 <i>${PAY[k][2]}</i></div>`;
h+=`${svg('W')}<div class="p">WILD заменяет все символы, кроме досье и сейфа</div>${svg('?')}<div class="p">СЕКРЕТНОЕ ДОСЬЕ: после остановки барабанов все папки превращаются в один и тот же случайный символ</div>${svg('V')}<div class="p">3+ СЕЙФА: выплата и 8 фриспинов (повтор +5)</div></div><p><b>243 способа выигрыша:</b> одинаковые символы на соседних барабанах слева направо, начиная с первого, минимум на трёх. Числа — доля ставки за каждый способ.</p><p><b>Бонус раскрытия:</b> 4–5 досье дают множитель x2, 6 и больше — x3. Во фриспинах досье раскрываются в более ценные символы, а иногда в WILD.</p><button class="cta" id="ok">ОК</button>`;
$('card').innerHTML=h;$('ov').classList.add('show');$('ok').onclick=()=>$('ov').classList.remove('show')}
$('spin').onclick=spin;$('rules').onclick=rules;
